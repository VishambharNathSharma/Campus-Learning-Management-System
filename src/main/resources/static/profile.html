<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Devanagari:wght@100;200;300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style4.css">

    <title>Profile</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="loo.png" alt="logo" class="logo">
            <h1><a href="index.html">Campus Learning Management System</a></h1>
                     <img class="dark" src="dark_mode.png" alt="darkmode">
            <nav class="navbar">
                <a href="about_us.html" class="alink">About Us</a>
                <a href="index.html" class="blink">Logout</a>
            </nav>
        </div>
        <div class="sidebar">
            <ul class="sidebar-links">
            <li><a href="StudentHome.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="dashboard.html">My Dashboard</a></li>
            <li><a href="#" id="coursesLink">Courses</a></li>
            </ul>
        </div>
        <div class="main-content">
                <div class="card1">
                    <img id="photo" src="">
                   <section>
                    <h3 id="studentName"></h3>
                </section>
                <section>

                    <button type="button" id="changeimg">Change Profile Picture</button>

                    <input type="file" id="proimg" accept="image/*" hidden/>
                </section>
                </div>
                <div class="card2">
                    <h2>ST1 Marks</h2>
                    <h1 class="percent" id="st1Percentage">0%</h1>
                    <ul id="st1Subjects">

                    </ul>
                </div>
                <div class="card3">
                       <h2>ST2 Marks</h2>
                    <h1 class="percent" id="st2Percentage">0%</h1>
                    <ul id="st2Subjects">

                    </ul>
                </div>
                <div class="card4">
                       <h2>PUT Marks</h2>
                    <h1 class="percent" id="putPercentage">0%</h1>
                    <ul id="putSubjects">

                    </ul>
                </div>
                <div class="card5">
                       <h2>ATTENDENCE <small>ST1</small></h2>
                    <h1 class="percent" id="attendanceSt1Percentage">0%</h1>
                    <ul id="attendanceSt1Subjects">
                    </ul>
                </div>
                <div class="card6">
                       <h2>ATTENDENCE <small>ST2</small></h2>
                    <h1 class="percent" id="attendanceSt2Percentage">0%</h1>
                    <ul id="attendanceSt2Subjects">

                    </ul>
                </div>
                <div class="card7">
                       <h2>ATTENDENCE <small>Overall</small></h2>
                    <h1 class="percent" id="attendanceOverallPercentage">0%</h1>
                    <ul id="attendanceOverallSubjects">

                    </ul>
                </div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>
    <script src="script.js"></script>
    <footer>
    <p>© 2026 Campus Learning Management System. All rights reserved.</p>
</footer>

</body>
</html>
