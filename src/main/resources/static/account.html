        <h2>Create Account</h2>
        <form id="registerForm">
            <label for="username" class="label">Name</label><br>
            <input type="text" id="username" name="username" class="input"><br>
            <span id="usernameError"></span>
            <label for="email" class="label">Email</label><br>
            <input type="text" id="email" name="email" class="input" ><br>
            <span id="emailerror"></span>
            <label for="Rollno"  class="label" >Roll No.</label><br>
            <input type="number" id="rollno" name="rollno" class="input"><br>
            <span id="rollnoerror"></span>
            <label for="password" name="password" class="label">Password</label><br>
            <input type="password" id="password" name="password" class="input"><br>
            <span id="passworderror"></span>
            <button type="submit" class="button" >Create Account</button>
        </form>
